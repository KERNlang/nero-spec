name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck -S warning install.sh skill/scripts/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure git for test fixtures
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: Run script tests
        run: |
          status=0
          for t in skill/scripts/test-*.sh; do
            [ "$t" = skill/scripts/test-spec-check-stacks.sh ] && continue
            echo "::group::$t"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Installer smoke test
        run: |
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/.claude" "$home/.codex"
          HOME="$home" ./install.sh
          test -f "$home/.claude/skills/spec/SKILL.md"
          test -f "$home/.codex/skills/spec/SKILL.md"
          HOME="$home" ./install.sh --uninstall
          test ! -e "$home/.claude/skills/spec"

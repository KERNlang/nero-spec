name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning install.sh skill/scripts/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for test fixtures
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: Run script tests
        run: |
          status=0
          for t in skill/scripts/test-*.sh; do
            [ "$t" = skill/scripts/test-spec-check-stacks.sh ] && continue
            echo "::group::$t"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Installer dry run
        run: ./install.sh --dry-run

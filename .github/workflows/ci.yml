name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -S warning install.sh skill/scripts/*.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MSYS: winsymlinks:nativestrict
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git for test fixtures
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          git config --global core.autocrlf false
      - name: Run script tests
        run: |
          status=0
          for t in skill/scripts/test-*.sh; do
            [ "$t" = skill/scripts/test-spec-check-stacks.sh ] && continue
            echo "== $t"
            bash "$t" || status=1
          done
          exit $status
      - name: Installer smoke test
        run: |
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/.claude" "$home/.codex"
          HOME="$home" ./install.sh
          test -f "$home/.claude/skills/spec/SKILL.md"
          test -f "$home/.codex/skills/spec/SKILL.md"
          HOME="$home" ./install.sh --uninstall
          test ! -e "$home/.claude/skills/spec"
